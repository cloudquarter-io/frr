hostname r1
password zebra
log stdout
!
vrf vrf-a
 vni 100
exit-vrf
!
interface r1-eth0
 ip address 192.168.100.1/24
!
interface r1-eth1 vrf vrf-a
 ip address 10.0.12.1/24
!
interface r1-eth2 vrf vrf-a
 ip address 10.0.13.1/24
!
router bgp 65001
 bgp router-id 192.168.100.1
 no bgp default ipv4-unicast
 !
 address-family l2vpn evpn
  advertise-all-vni
 exit-address-family
!
router bgp 65001 vrf vrf-a
 bgp router-id 10.0.12.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.12.2 timers 3 10
 neighbor 10.0.12.2 timers connect 1
 neighbor 10.0.13.3 remote-as 65003
 neighbor 10.0.13.3 timers 3 10
 neighbor 10.0.13.3 timers connect 1
 !
 address-family ipv4 unicast
  maximum-paths 8
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
