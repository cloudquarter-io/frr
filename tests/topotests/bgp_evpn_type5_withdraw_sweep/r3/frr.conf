hostname r3
password zebra
log stdout
!
interface r3-eth0
 ip address 10.0.13.3/24
!
router bgp 65003
 bgp router-id 10.0.13.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.13.1 timers 3 10
 neighbor 10.0.13.1 timers connect 1
 neighbor 10.0.13.1 shutdown
 !
 address-family ipv4 unicast
  network 192.0.2.10/32
 exit-address-family
!
