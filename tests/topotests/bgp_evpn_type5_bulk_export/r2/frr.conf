hostname r2
password zebra
log stdout
!
interface r2-eth0
 ip address 10.0.12.2/24
!
router bgp 65002
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 timers 3 10
 neighbor 10.0.12.1 timers connect 1
 !
 address-family ipv4 unicast
  network 192.0.2.10/32
 exit-address-family
!
